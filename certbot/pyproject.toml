[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "certbot-dns-ispconfig-rest"
version = "1.0.1"
description = "Certbot DNS authenticator for zones hosted in ISPConfig, through ispconfig-rest"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
dependencies = ["certbot>=2.0", "requests>=2.20"]
keywords = ["certbot", "letsencrypt", "acme", "dns-01", "ispconfig"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/FELDSAM-INC/ispconfig-acme-dns"
Documentation = "https://github.com/FELDSAM-INC/ispconfig-acme-dns#readme"
Source = "https://github.com/FELDSAM-INC/ispconfig-acme-dns/tree/main/certbot"
Issues = "https://github.com/FELDSAM-INC/ispconfig-acme-dns/issues"

[project.entry-points."certbot.plugins"]
dns-ispconfig-rest = "certbot_dns_ispconfig_rest._internal.dns_ispconfig_rest:Authenticator"

[tool.setuptools]
packages = ["certbot_dns_ispconfig_rest", "certbot_dns_ispconfig_rest._internal"]
